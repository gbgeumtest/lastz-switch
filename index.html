<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GB YS">
<title>GB YS</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--card:#171d2c;--line:#303b55;--muted:#9ba6bc;--blue:#3d74ff;--red:#e34b59;--green:#65dc8d;--amber:#f2c25c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input{font:inherit}
button{cursor:pointer}
.wrap{max-width:520px;margin:0 auto;padding:24px 20px calc(32px + env(safe-area-inset-bottom))}
h1{font-size:32px;margin:0 0 3px}.sub{color:var(--muted);margin-bottom:20px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.tab{border:1px solid var(--line);border-radius:13px;padding:11px;background:#12192a;color:var(--muted);font-weight:800}
.tab.active{background:#26344f;color:#fff;border-color:#5773a8}.tab:disabled{opacity:.45}
.account{width:100%;border:0;border-radius:18px;padding:19px;margin:8px 0;color:#fff;text-align:left;box-shadow:inset 0 0 0 1px #ffffff20}
.account strong{display:block;font-size:22px}.account span{display:block;margin-top:5px;font-size:14px;color:#eef2ff;opacity:.86}
.main{background:var(--blue)}.sub-account{background:var(--red)}
.card{background:var(--card);border:1px solid #202a40;border-radius:17px;padding:16px;margin:14px 0}
.status-title{font-weight:800}.small{font-size:13px;color:var(--muted);line-height:1.55}
.connection{display:flex;align-items:center;gap:8px;margin-top:10px;color:var(--muted);font-size:14px}
.dot{width:9px;height:9px;border-radius:50%;background:#667189;box-shadow:0 0 0 3px #66718920}
.dot.ok{background:var(--green);box-shadow:0 0 0 3px #65dc8d20}.dot.wait{background:var(--amber);box-shadow:0 0 0 3px #f2c25c20}.dot.bad{background:var(--red);box-shadow:0 0 0 3px #e34b5920}
.otp-label{text-align:center;color:var(--muted);font-size:13px}
.otp{display:block;text-align:center;font:800 43px/1.25 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:8px;margin:7px 0 14px}
.btn{width:100%;border:1px solid var(--line);border-radius:13px;padding:13px;background:#1c2435;color:#fff;font-weight:750}
.btn.primary{background:#315fda;border-color:#4779ed}.btn:disabled{opacity:.45;cursor:default}
.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
details summary{cursor:pointer;font-weight:800}
label{display:block;margin:13px 0 6px;color:var(--muted);font-size:13px}
input{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:#0f1522;color:#fff}
.privacy{margin-top:18px}
.notice{min-height:20px;margin-top:8px}
@media(max-width:360px){.otp{font-size:36px;letter-spacing:5px}.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="wrap">
  <h1>GB YS</h1>
  <div class="sub">Last Z Switch · Private Tool</div>
  <nav aria-label="기능 메뉴" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px">
    <a href="./index.html" aria-current="page" style="text-decoration:none;text-align:center;padding:12px;border-radius:12px;background:#26344f;color:#fff;border:1px solid #5773a8;font-weight:800">계정 전환</a>
    <a href="./scanner.html" style="text-decoration:none;text-align:center;padding:12px;border-radius:12px;background:#12192a;color:#fff;border:1px solid #303b55;font-weight:800">실시간 스캐너</a>
  </nav>

  <div class="tabs" aria-label="사용자 선택">
    <button class="tab active" type="button">GB</button>
    <button class="tab" type="button" disabled title="추후 연결 예정">YS</button>
  </div>

  <button class="account main" type="button" onclick="selectAccount('main')">
    <strong>본계</strong><span id="mainLabel">이메일 미설정</span>
  </button>
  <button class="account sub-account" type="button" onclick="selectAccount('sub')">
    <strong>부계</strong><span id="subLabel">이메일 미설정</span>
  </button>

  <section class="card" aria-live="polite">
    <div class="status-title" id="status">사용할 계정을 누르세요</div>
    <div class="small notice" id="detail">이메일을 복사하고 새 인증번호 확인을 시작합니다.</div>
    <div class="connection">
      <span class="dot" id="mailDot"></span>
      <span id="mailState">메일 연결 상태 확인 중</span>
    </div>
  </section>

  <section class="card">
    <div class="otp-label">최근 인증번호</div>
    <output class="otp" id="otp" aria-label="최근 인증번호">------</output>
    <div class="row">
      <button class="btn primary" id="copyOtpButton" type="button" onclick="copyOtp()" disabled>인증번호 복사</button>
      <button class="btn" id="checkButton" type="button" onclick="restartPolling()">메일 다시 확인</button>
    </div>
  </section>

  <button class="btn" type="button" onclick="openGame()">Last Z 열기</button>

  <details class="card" id="settings">
    <summary>설정</summary>
    <label for="mainEmail">본계 이메일</label>
    <input id="mainEmail" type="email" inputmode="email" autocomplete="off" placeholder="본계 이메일">
    <label for="subEmail">부계 이메일</label>
    <input id="subEmail" type="email" inputmode="email" autocomplete="off" placeholder="부계 이메일">
    <label for="accessKey">메일 연결 키</label>
    <input id="accessKey" type="password" autocomplete="off" placeholder="Render OTP_ACCESS_KEY와 같은 값">
    <p class="small">Naver 비밀번호가 아닙니다. 공개된 OTP API를 보호하는 개인 연결 키이며 이 기기에만 저장됩니다.</p>
    <button class="btn primary" type="button" onclick="saveSettings()">설정 저장</button>
  </details>

  <section class="card privacy">
    <strong>Privacy</strong>
    <p class="small">Naver 비밀번호, 앱 비밀번호, 메일 본문, 인증번호 기록은 이 페이지나 GitHub에 저장하지 않습니다. 이메일 주소와 연결 키만 이 기기의 브라우저 저장소에 보관합니다.</p>
    <button class="btn" type="button" onclick="clearData()">내 정보 초기화</button>
  </section>
</main>

<script>
const API_BASE = "https://lastz-switch-2.onrender.com";
const APP_STORE_URL = "https://apps.apple.com/kr/app/id6503272652";
const POLL_INTERVAL_MS = 3500;
const POLL_WINDOW_MS = 90000;
const PENDING_MAX_AGE_MS = 30 * 60 * 1000;
let pollRun = 0;
let currentOtp = "";

const el = (id) => document.getElementById(id);
const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

function accountEmail(account) {
  return localStorage.getItem(account) || "";
}

function accountName(account) {
  return account === "main" ? "본계" : "부계";
}

function setConnection(kind, text) {
  el("mailDot").className = "dot" + (kind ? " " + kind : "");
  el("mailState").textContent = text;
}

function setMessage(title, detail) {
  el("status").textContent = title;
  el("detail").textContent = detail;
}

function load() {
  const main = accountEmail("main");
  const sub = accountEmail("sub");
  el("mainEmail").value = main;
  el("subEmail").value = sub;
  el("accessKey").value = localStorage.getItem("otpAccessKey") || "";
  el("mainLabel").textContent = main || "이메일 미설정";
  el("subLabel").textContent = sub || "이메일 미설정";
}

async function copyText(value, allowFallback) {
  if (!value) return false;
  try {
    await navigator.clipboard.writeText(value);
    return true;
  } catch {
    if (!allowFallback) return false;
    const area = document.createElement("textarea");
    area.value = value;
    area.style.position = "fixed";
    area.style.opacity = "0";
    document.body.appendChild(area);
    area.focus();
    area.select();
    const copied = document.execCommand("copy");
    area.remove();
    return copied;
  }
}

function pendingRequest() {
  const account = localStorage.getItem("pendingAccount");
  const after = Number(localStorage.getItem("pendingAfter"));
  if (!["main", "sub"].includes(account) || !Number.isFinite(after)) return null;
  if (Date.now() - after > PENDING_MAX_AGE_MS) {
    clearPending();
    return null;
  }
  return { account, after };
}

function clearPending() {
  localStorage.removeItem("pendingAccount");
  localStorage.removeItem("pendingAfter");
}

async function selectAccount(account) {
  localStorage.setItem("lastAccount", account);
  const email = accountEmail(account);
  if (!email) {
    el("settings").open = true;
    setMessage(accountName(account) + " 이메일 미설정", "설정에서 이메일을 먼저 저장하세요.");
    return;
  }

  const copied = await copyText(email, true);
  const after = Date.now() - 5000;
  localStorage.setItem("pendingAccount", account);
  localStorage.setItem("pendingAfter", String(after));
  setMessage(
    accountName(account) + (copied ? " 이메일 복사 완료" : " 이메일 선택 완료"),
    copied ? "Last Z에서 이메일을 붙여넣으세요. 새 인증번호를 기다립니다." : "복사가 차단되었습니다. 이메일을 직접 복사한 뒤 새 인증번호를 기다리세요.",
  );
  startPolling();
  setTimeout(openGame, 350);
}

function openGame() {
  const customUrl = localStorage.getItem("lastz") || "";
  setMessage("Last Z 여는 중", "앱이 바로 열리지 않으면 App Store에서 열기를 누르세요.");
  location.href = customUrl || APP_STORE_URL;
}

async function checkServer() {
  setConnection("wait", "서버 깨우는 중");
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 65000);
  try {
    const response = await fetch(API_BASE + "/", { cache: "no-store", signal: controller.signal });
    const data = await response.json();
    if (!response.ok || !data.ok) throw new Error("health_failed");
    if (!data.accessKeyConfigured) {
      setConnection("bad", "서버 연결 키 설정 필요");
    } else if (!data.accounts?.main || !data.accounts?.sub) {
      setConnection("bad", "메일 계정 설정 확인 필요");
    } else if (!localStorage.getItem("otpAccessKey")) {
      setConnection("bad", "이 기기의 연결 키 입력 필요");
    } else {
      setConnection("ok", "연결됨");
    }
  } catch {
    setConnection("bad", "서버 응답 없음");
  } finally {
    clearTimeout(timeout);
  }
}

function errorText(code) {
  return {
    access_key_not_configured: "Render에 OTP_ACCESS_KEY 설정이 필요합니다.",
    access_denied: "메일 연결 키가 맞지 않습니다.",
    mail_not_configured: "Render의 메일 계정 환경변수를 확인하세요.",
    mail_connection_failed: "Naver 메일 연결에 실패했습니다.",
    invalid_after: "인증메일 확인 시간이 올바르지 않습니다.",
  }[code] || "메일 확인 중 오류가 발생했습니다.";
}

async function fetchOtp(account, after) {
  const key = localStorage.getItem("otpAccessKey") || "";
  if (!key) return { stop: true, error: "access_denied" };
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 60000);
  try {
    const url = API_BASE + "/api/otp/" + account + "?after=" + encodeURIComponent(new Date(after).toISOString());
    const response = await fetch(url, {
      cache: "no-store",
      headers: { "X-OTP-Access-Key": key },
      signal: controller.signal,
    });
    const data = await response.json().catch(() => ({}));
    if (response.ok && data.ok) return { code: data.code, receivedAt: data.receivedAt };
    if (response.status === 404 && data.error === "otp_not_found") return { pending: true };
    return { stop: true, error: data.error || "mail_connection_failed" };
  } catch (error) {
    if (error.name === "AbortError") return { pending: true, waking: true };
    return { pending: true };
  } finally {
    clearTimeout(timeout);
  }
}

async function startPolling() {
  const request = pendingRequest();
  if (!request || document.hidden) return;
  const run = ++pollRun;
  const deadline = Date.now() + POLL_WINDOW_MS;
  setConnection("wait", "메일 확인 중");

  while (run === pollRun && Date.now() < deadline) {
    const result = await fetchOtp(request.account, request.after);
    if (run !== pollRun) return;
    if (result.code) {
      currentOtp = result.code;
      el("otp").textContent = result.code;
      el("copyOtpButton").disabled = false;
      clearPending();
      setConnection("ok", "새 인증번호 수신");
      const autoCopied = await copyText(result.code, false);
      setMessage(
        accountName(request.account) + " 인증번호 도착",
        autoCopied ? "인증번호가 클립보드에 복사되었습니다." : "아래 인증번호 복사 버튼을 누르세요.",
      );
      if (navigator.vibrate) navigator.vibrate([80, 40, 80]);
      return;
    }
    if (result.stop) {
      setConnection("bad", "연결 확인 필요");
      setMessage("메일 확인 중지", errorText(result.error));
      if (result.error === "access_denied") el("settings").open = true;
      return;
    }
    setConnection("wait", result.waking ? "서버 깨우는 중" : "메일 확인 중");
    await sleep(POLL_INTERVAL_MS);
  }

  if (run === pollRun) {
    setConnection("wait", "인증번호 대기");
    setMessage("아직 새 인증번호가 없습니다", "Last Z에서 인증메일을 보냈다면 메일 다시 확인을 누르세요.");
  }
}

function restartPolling() {
  let request = pendingRequest();
  if (!request) {
    const account = localStorage.getItem("lastAccount");
    if (!["main", "sub"].includes(account)) {
      setMessage("확인할 계정이 없습니다", "먼저 본계 또는 부계를 누르세요.");
      return;
    }
    const after = Date.now() - 5 * 60 * 1000;
    localStorage.setItem("pendingAccount", account);
    localStorage.setItem("pendingAfter", String(after));
  }
  startPolling();
}

async function copyOtp() {
  const copied = await copyText(currentOtp, true);
  setMessage(copied ? "인증번호 복사 완료" : "인증번호 복사 실패", copied ? "Last Z 인증번호 칸에 붙여넣으세요." : "번호를 길게 눌러 직접 복사하세요.");
}

function saveSettings() {
  const main = el("mainEmail").value.trim();
  const sub = el("subEmail").value.trim();
  const key = el("accessKey").value.trim();
  if (main) localStorage.setItem("main", main); else localStorage.removeItem("main");
  if (sub) localStorage.setItem("sub", sub); else localStorage.removeItem("sub");
  if (key) localStorage.setItem("otpAccessKey", key); else localStorage.removeItem("otpAccessKey");
  load();
  setMessage("설정 저장 완료", "본계 또는 부계를 누르면 이메일 복사와 인증번호 확인이 시작됩니다.");
  checkServer();
}

function clearData() {
  if (!confirm("이 기기에 저장된 이메일과 연결 키를 삭제할까요?")) return;
  pollRun += 1;
  ["main", "sub", "otpAccessKey", "pendingAccount", "pendingAfter", "lastAccount", "lastz"].forEach((key) => localStorage.removeItem(key));
  currentOtp = "";
  el("otp").textContent = "------";
  el("copyOtpButton").disabled = true;
  load();
  setConnection("", "메일 연결 상태 확인 중");
  setMessage("내 정보 초기화 완료", "이 기기에 저장된 이메일과 연결 키를 삭제했습니다.");
  checkServer();
}

document.addEventListener("visibilitychange", () => {
  if (!document.hidden && pendingRequest()) startPolling();
});
window.addEventListener("pageshow", () => {
  if (pendingRequest()) startPolling();
});

load();
checkServer();
if (pendingRequest()) startPolling();
</script>
</body>
</html>
