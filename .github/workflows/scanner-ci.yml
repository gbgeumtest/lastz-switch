name: Scanner API validation
on:
  push:
    branches: [feature/lastz-live-scanner-ios]
    paths:
      - 'scanner/server/**'
      - '.github/workflows/scanner-ci.yml'
  pull_request:
    paths:
      - 'scanner/server/**'
      - '.github/workflows/scanner-ci.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r scanner/server/requirements.txt httpx
      - name: Test scanner API
        working-directory: scanner/server
        run: python -m unittest discover -v
